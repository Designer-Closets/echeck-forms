<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="360" height="460" fill="#ffffff"/>

  <!-- Entry wall to right of door -->
  <line x1="207.5" y1="390" x2="320" y2="390" stroke="#9ca3af" stroke-width="5"/>
  <text x="265" y="410" font-size="11" fill="#6b7280" text-anchor="middle">entry wall</text>

  <!-- Door -->
  <line x1="207.5" y1="390" x2="207.5" y2="335" stroke="#dc2626" stroke-width="2"/>
  <path d="M 207.5 335 A 55 55 0 0 0 152.5 390" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="207.5" y="430" font-size="12" fill="#dc2626" text-anchor="middle">DOOR (enter)</text>

  <!-- Wall 1: D4 (180), straight left, 27.5 -->
  <line x1="207.5" y1="390" x2="70" y2="390" stroke="#111827" stroke-width="6"/>
  <text x="138" y="410" font-size="13" font-weight="bold" text-anchor="middle">27½"</text>
  <text x="138" y="378" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle">D4 (180°)</text>

  <!-- Wall 2: D2 (90), up, 64 -->
  <line x1="70" y1="390" x2="70" y2="70" stroke="#111827" stroke-width="6"/>
  <text x="58" y="235" font-size="13" font-weight="bold" text-anchor="end">64"</text>
  <text x="84" y="235" font-size="12" fill="#059669" font-weight="bold" text-anchor="start">D2 (90°)</text>

  <!-- Corner mark -->
  <path d="M 70 360 L 70 390 L 100 390" fill="none" stroke="#059669" stroke-width="2"/>

  <!-- badges -->
  <circle cx="138" cy="390" r="11" fill="#2563eb"/><text x="138" y="394" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="70" cy="230" r="11" fill="#2563eb"/><text x="70" y="234" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <circle cx="207.5" cy="390" r="5" fill="#dc2626"/>

  <text x="180" y="30" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">D4 27.5 D2 64</text>
</svg>
