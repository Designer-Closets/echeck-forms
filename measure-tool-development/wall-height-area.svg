<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="380" fill="#ffffff"/>
  <text x="330" y="28" font-size="16" font-weight="bold" text-anchor="middle">Wall height &amp; area (elevation view — widths exaggerated for clarity)</text>

  <!-- FLAT wall -->
  <rect x="90" y="120" width="150" height="180" fill="#dbeafe" stroke="#111827" stroke-width="3"/>
  <text x="80" y="215" font-size="13" text-anchor="end">109" tall</text>
  <text x="165" y="320" font-size="13" text-anchor="middle">27½" wide</text>
  <text x="165" y="205" font-size="12" fill="#1d4ed8" text-anchor="middle">area =</text>
  <text x="165" y="222" font-size="12" fill="#1d4ed8" text-anchor="middle">109 × 27.5</text>
  <text x="165" y="239" font-size="12" fill="#1d4ed8" text-anchor="middle">≈ 20.8 ft²</text>
  <text x="165" y="350" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">D4,109,27.5</text>
  <text x="165" y="100" font-size="12" fill="#6b7280" text-anchor="middle">FLAT (one height)</text>

  <!-- RAKED wall (vaulted, rises left->right) -->
  <polygon points="430,160 580,90 580,300 430,300" fill="#fef3c7" stroke="#111827" stroke-width="3"/>
  <text x="420" y="235" font-size="13" text-anchor="end">109"</text>
  <text x="592" y="200" font-size="13" text-anchor="start">140"</text>
  <text x="505" y="320" font-size="13" text-anchor="middle">27½" wide</text>
  <text x="500" y="240" font-size="12" fill="#b45309" text-anchor="middle">area =</text>
  <text x="500" y="257" font-size="12" fill="#b45309" text-anchor="middle">(109+140)/2 × 27.5</text>
  <text x="500" y="274" font-size="12" fill="#b45309" text-anchor="middle">≈ 23.8 ft²</text>
  <text x="505" y="350" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">D4,109,140,27.5</text>
  <text x="505" y="70" font-size="12" fill="#6b7280" text-anchor="middle">RAKED / vaulted (two heights)</text>

  <text x="330" y="375" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">rule: width is always the LAST number; the number(s) before it are height(s)</text>
</svg>
