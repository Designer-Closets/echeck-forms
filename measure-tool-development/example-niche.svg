<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="600" height="600" fill="#ffffff"/>

  <!-- interior fill (chain + closing gap) -->
  <polygon points="121,325 80,284 284,80 487,284 284,487 225,487" fill="#dbeafe" fill-opacity="0.45" stroke="none"/>

  <!-- Walls -->
  <line x1="121" y1="325" x2="80"  y2="284" stroke="#111827" stroke-width="5"/> <!-- Wall1 3.25 -->
  <line x1="80"  y1="284" x2="284" y2="80"  stroke="#111827" stroke-width="5"/> <!-- Wall2 16 -->
  <line x1="284" y1="80"  x2="487" y2="284" stroke="#111827" stroke-width="5"/> <!-- Wall3 16 -->
  <line x1="487" y1="284" x2="284" y2="487" stroke="#111827" stroke-width="5"/> <!-- Wall4 16 -->
  <line x1="284" y1="487" x2="225" y2="487" stroke="#111827" stroke-width="5"/> <!-- Wall5 3.25 -->

  <!-- Closing / open side back to door -->
  <line x1="225" y1="487" x2="121" y2="325" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Length labels -->
  <text x="86"  y="300" font-size="13" text-anchor="end"   font-weight="bold">3¼"</text>
  <text x="172" y="178" font-size="13" text-anchor="end"   font-weight="bold">16"</text>
  <text x="398" y="178" font-size="13" text-anchor="start" font-weight="bold">16"</text>
  <text x="398" y="392" font-size="13" text-anchor="start" font-weight="bold">16"</text>
  <text x="254" y="505" font-size="13" text-anchor="middle" font-weight="bold">3¼"</text>
  <text x="150" y="415" font-size="12" fill="#dc2626" text-anchor="middle">open side ≈ 10.70"</text>

  <!-- Sector tags at corners -->
  <g font-size="12" fill="#059669" font-weight="bold">
    <text x="60"  y="300">start -3-</text>
    <text x="92"  y="278">-2-</text>
    <text x="284" y="64" text-anchor="middle">-2-</text>
    <text x="500" y="288">-2-</text>
    <text x="300" y="500">-3-</text>
  </g>

  <!-- Wall number badges -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="100" cy="304" r="11" fill="#2563eb"/><text x="100" y="308" fill="#fff">1</text>
    <circle cx="182" cy="182" r="11" fill="#2563eb"/><text x="182" y="186" fill="#fff">2</text>
    <circle cx="385" cy="182" r="11" fill="#2563eb"/><text x="385" y="186" fill="#fff">3</text>
    <circle cx="385" cy="385" r="11" fill="#2563eb"/><text x="385" y="389" fill="#fff">4</text>
    <circle cx="254" cy="487" r="11" fill="#2563eb"/><text x="254" y="491" fill="#fff">5</text>
  </g>

  <!-- Door / start marker -->
  <circle cx="121" cy="325" r="5" fill="#dc2626"/>
  <text x="121" y="345" font-size="12" fill="#dc2626" text-anchor="middle">DOOR / start</text>

  <text x="300" y="285" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">-3- 3.25 -2- 16 -2- 16 -2- 16 -3- 3.25</text>
</svg>
