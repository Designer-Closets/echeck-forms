<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
  <text x="280" y="24" font-size="14" font-weight="bold" text-anchor="middle">H109,27,/110,27,/114,27,27   (one straight wall, ceiling profile)</text>

  <!-- wall fill -->
  <polygon points="60,320 60,160 168,160 276,152 384,120 492,120 492,320" fill="#fef3c7" stroke="#111827" stroke-width="3"/>

  <!-- node guides -->
  <line x1="168" y1="160" x2="168" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="276" y1="152" x2="276" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="384" y1="120" x2="384" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- height labels -->
  <text x="56" y="154" font-size="12" text-anchor="end">109"</text>
  <text x="168" y="150" font-size="12" text-anchor="middle">109"</text>
  <text x="276" y="142" font-size="12" text-anchor="middle">110"</text>
  <text x="384" y="110" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">114"</text>
  <text x="498" y="114" font-size="12" text-anchor="start">114"</text>

  <!-- width labels -->
  <text x="114" y="338" font-size="12" text-anchor="middle">27"</text>
  <text x="222" y="338" font-size="12" text-anchor="middle">27"</text>
  <text x="330" y="338" font-size="12" text-anchor="middle">27"</text>
  <text x="438" y="338" font-size="12" text-anchor="middle">27"</text>

  <!-- segment codes -->
  <text x="114" y="250" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">H109</text>
  <text x="222" y="250" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">/110</text>
  <text x="330" y="250" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">/114</text>
  <text x="438" y="250" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">27</text>
  <text x="438" y="266" font-size="10" fill="#6b7280" text-anchor="middle">(level)</text>

  <text x="280" y="352" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">vertical exaggerated to show the rise · bare width = level at the inherited height</text>
</svg>
