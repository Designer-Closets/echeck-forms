<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="240" fill="#ffffff"/>
  <text x="350" y="28" font-size="17" font-weight="bold" text-anchor="middle">Archway and barn-door codes</text>

  <!-- A0 : archway / open (cx130 wy150) -->
  <line x1="40" y1="150" x2="95" y2="150" stroke="#111827" stroke-width="5"/>
  <line x1="165" y1="150" x2="220" y2="150" stroke="#111827" stroke-width="5"/>
  <path d="M95,150 Q130,100 165,150" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="130" y="185" font-size="15" font-weight="bold" text-anchor="middle">A0</text>
  <text x="130" y="203" font-size="11" fill="#6b7280" text-anchor="middle">archway / open (no door)</text>

  <!-- XL : barn door slides left (cx360 wy150) -->
  <line x1="270" y1="150" x2="325" y2="150" stroke="#111827" stroke-width="5"/>
  <line x1="395" y1="150" x2="450" y2="150" stroke="#111827" stroke-width="5"/>
  <line x1="285" y1="128" x2="445" y2="128" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="290" y1="135" x2="360" y2="135" stroke="#b45309" stroke-width="7"/>
  <line x1="345" y1="116" x2="305" y2="116" stroke="#b45309" stroke-width="1.5"/><polygon points="305,116 311,113 311,119" fill="#b45309"/>
  <text x="360" y="185" font-size="15" font-weight="bold" text-anchor="middle">XL</text>
  <text x="360" y="203" font-size="11" fill="#6b7280" text-anchor="middle">barn door — slides left</text>

  <!-- XR : barn door slides right (cx570 wy150) -->
  <line x1="480" y1="150" x2="535" y2="150" stroke="#111827" stroke-width="5"/>
  <line x1="605" y1="150" x2="660" y2="150" stroke="#111827" stroke-width="5"/>
  <line x1="495" y1="128" x2="655" y2="128" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="580" y1="135" x2="650" y2="135" stroke="#b45309" stroke-width="7"/>
  <line x1="595" y1="116" x2="635" y2="116" stroke="#b45309" stroke-width="1.5"/><polygon points="635,116 629,113 629,119" fill="#b45309"/>
  <text x="570" y="185" font-size="15" font-weight="bold" text-anchor="middle">XR</text>
  <text x="570" y="203" font-size="11" fill="#6b7280" text-anchor="middle">barn door — slides right</text>

  <text x="350" y="230" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">barn door = surface-mounted on a track (X), parks to the L or R side</text>
</svg>
