<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="440" height="370" fill="#ffffff"/>
  <text x="220" y="26" font-size="16" font-weight="bold" text-anchor="middle">72RID427.5</text>
  <text x="220" y="46" font-size="11" fill="#2563eb" text-anchor="middle">ROOM (inside) is up</text>

  <!-- Wall 1: D4 straight left, 27.5 -->
  <line x1="40" y1="300" x2="122" y2="300" stroke="#111827" stroke-width="6"/>
  <text x="81" y="320" font-size="12" font-weight="bold" text-anchor="middle">Wall 1: 27½"</text>
  <text x="81" y="336" font-size="11" fill="#059669" text-anchor="middle">D4 (180°)</text>

  <!-- Door opening 72" with RI swing (hinge right, swing in) -->
  <line x1="339" y1="300" x2="339" y2="84" stroke="#dc2626" stroke-width="3"/>
  <path d="M339,84 A216,216 0 0,0 122,300" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="339" cy="300" r="5" fill="#dc2626"/>
  <text x="230" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">Door 72"  •  RI</text>
  <text x="230" y="336" font-size="11" fill="#6b7280" text-anchor="middle">hinge right, swing in</text>

  <!-- entry wall continues right of door -->
  <line x1="339" y1="300" x2="400" y2="300" stroke="#9ca3af" stroke-width="5"/>
  <text x="370" y="320" font-size="10" fill="#6b7280" text-anchor="middle">entry wall</text>

  <!-- corner A -->
  <circle cx="122" cy="300" r="4" fill="#2563eb"/>
  <text x="122" y="290" font-size="10" fill="#2563eb" text-anchor="middle">A</text>
</svg>
