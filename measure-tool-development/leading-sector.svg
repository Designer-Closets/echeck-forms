<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>

  <!-- Entry wall to the RIGHT of door (baseline, "wall 0") -->
  <line x1="280" y1="300" x2="470" y2="300" stroke="#9ca3af" stroke-width="5"/>
  <text x="375" y="320" font-size="12" fill="#6b7280" text-anchor="middle">entry wall (baseline)</text>

  <!-- Door at A -->
  <line x1="280" y1="300" x2="280" y2="248" stroke="#dc2626" stroke-width="2"/>
  <path d="M 280 248 A 52 52 0 0 0 228 300" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="280" y="338" font-size="12" fill="#dc2626" text-anchor="middle">DOOR (you enter here)</text>

  <!-- Default straight-left (-4- / 180) for contrast -->
  <line x1="280" y1="300" x2="143" y2="300" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="150" y="293" font-size="11" fill="#94a3b8" text-anchor="start">default -4- (180°): straight left</text>

  <!-- Wall 1 leaving at 135 (3 sectors), NW diagonal, length 27.5 -->
  <line x1="280" y1="300" x2="183" y2="203" stroke="#111827" stroke-width="5"/>
  <text x="205" y="240" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-45 205 240)">Wall 1: 27½"</text>

  <!-- Angle arc from East baseline up to wall 1 -->
  <path d="M 335 300 A 55 55 0 0 0 241 261" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="312" y="250" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">3 sectors = 135°</text>

  <!-- Start badge -->
  <circle cx="280" cy="300" r="5" fill="#2563eb"/>
</svg>
