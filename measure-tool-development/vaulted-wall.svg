<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
  <text x="280" y="26" font-size="14" font-weight="bold" text-anchor="middle">D4,H108,27.5,/142,65,\108,65   (wall elevation, unfolded)</text>

  <!-- wall outline -->
  <polygon points="60,320 60,126 137,126 319,64 501,126 501,320" fill="#fef3c7" stroke="#111827" stroke-width="3"/>

  <!-- vertical guides -->
  <line x1="137" y1="126" x2="137" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="319" y1="64" x2="319" y2="320" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- height labels -->
  <text x="54" y="120" font-size="12" text-anchor="end">108"</text>
  <text x="143" y="120" font-size="12" text-anchor="start">108"</text>
  <text x="319" y="56" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">142" ridge</text>
  <text x="507" y="120" font-size="12" text-anchor="start">108"</text>

  <!-- width labels -->
  <text x="98"  y="338" font-size="12" text-anchor="middle">27½"</text>
  <text x="228" y="338" font-size="12" text-anchor="middle">65"</text>
  <text x="410" y="338" font-size="12" text-anchor="middle">65"</text>

  <!-- segment codes -->
  <text x="98"  y="230" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">H108</text>
  <text x="225" y="150" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">/142</text>
  <text x="415" y="150" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">\108</text>

  <!-- ridge marker -->
  <circle cx="319" cy="64" r="4" fill="#b45309"/>

  <text x="280" y="362" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">/ = rising, \ = dropping; the number is the END height; start height is inherited from the previous wall</text>
</svg>
