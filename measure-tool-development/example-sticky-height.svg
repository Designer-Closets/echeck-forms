<svg xmlns="http://www.w3.org/2000/svg" width="430" height="300" viewBox="0 0 430 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="430" height="300" fill="#ffffff"/>
  <text x="215" y="24" font-size="14" font-weight="bold" text-anchor="middle">D4,H108,27.5,D2,63,D2,104   (plan view)</text>

  <!-- interior hint -->
  <polygon points="122.5,229 40,229 40,40 352,40" fill="#dbeafe" fill-opacity="0.35" stroke="none"/>

  <!-- Wall 1: D4 west, 27.5 -->
  <line x1="122.5" y1="229" x2="40" y2="229" stroke="#111827" stroke-width="6"/>
  <text x="81" y="249" font-size="12" font-weight="bold" text-anchor="middle">27½"</text>
  <text x="81" y="263" font-size="10" fill="#059669" text-anchor="middle">D4 · H108</text>

  <!-- Wall 2: D2 north, 63 -->
  <line x1="40" y1="229" x2="40" y2="40" stroke="#111827" stroke-width="6"/>
  <text x="28" y="138" font-size="12" font-weight="bold" text-anchor="end">63"</text>
  <text x="58" y="138" font-size="10" fill="#059669" text-anchor="start">D2 · (108)</text>

  <!-- Wall 3: D2 east, 104 -->
  <line x1="40" y1="40" x2="352" y2="40" stroke="#111827" stroke-width="6"/>
  <text x="196" y="32" font-size="12" font-weight="bold" text-anchor="middle">104"</text>
  <text x="196" y="58" font-size="10" fill="#059669" text-anchor="middle">D2 · (108)</text>

  <!-- door at A, entry wall continues right -->
  <line x1="122.5" y1="229" x2="200" y2="229" stroke="#9ca3af" stroke-width="5"/>
  <text x="161" y="249" font-size="10" fill="#6b7280" text-anchor="middle">entry wall</text>
  <circle cx="122.5" cy="229" r="4" fill="#2563eb"/>
