<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="410" fill="#ffffff"/>

  <!-- Room interior -->
  <polygon points="60,316 60,60 628,60 628,316" fill="#dbeafe" fill-opacity="0.5" stroke="none"/>

  <!-- Walls (clockwise from door) -->
  <line x1="170" y1="316" x2="60"  y2="316" stroke="#111827" stroke-width="5"/> <!-- Wall 1 West 27.5 -->
  <line x1="60"  y1="316" x2="60"  y2="60"  stroke="#111827" stroke-width="5"/> <!-- Wall 2 North 64 -->
  <line x1="60"  y1="60"  x2="628" y2="60"  stroke="#111827" stroke-width="5"/> <!-- Wall 3 East 142 -->
  <line x1="628" y1="60"  x2="628" y2="316" stroke="#111827" stroke-width="5"/> <!-- Wall 4 South 63.78 -->
  <line x1="628" y1="316" x2="296" y2="316" stroke="#111827" stroke-width="5"/> <!-- Wall 5 West 83 -->

  <!-- Doorway gap + swing -->
  <line x1="170" y1="316" x2="170" y2="190" stroke="#dc2626" stroke-width="2"/>
  <path d="M 170 190 A 126 126 0 0 1 296 316" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Entry arrow -->
  <line x1="233" y1="392" x2="233" y2="334" stroke="#dc2626" stroke-width="2"/>
  <polygon points="233,326 228,338 238,338" fill="#dc2626"/>
  <text x="233" y="406" fill="#dc2626" font-size="13" text-anchor="middle">ENTER (turn left)</text>
  <text x="233" y="304" fill="#dc2626" font-size="12" text-anchor="middle" font-weight="bold">DOOR 31½"</text>

  <!-- Wall labels -->
  <text x="115" y="336" font-size="13" text-anchor="middle">Wall 1: 27½"</text>
  <text x="52"  y="192" font-size="13" text-anchor="end">Wall 2: 64"</text>
  <text x="344" y="48"  font-size="13" text-anchor="middle">Wall 3: 142"</text>
  <text x="636" y="192" font-size="13" text-anchor="start">Wall 4: 63.78"</text>
  <text x="462" y="336" font-size="13" text-anchor="middle">Wall 5: 83"</text>

  <!-- Corner sector tags (all 90 = 2 sectors) -->
  <g font-size="10" fill="#059669" font-weight="bold" text-anchor="middle">
    <text x="74" y="304">2</text>
    <text x="74" y="74">2</text>
    <text x="614" y="74">2</text>
    <text x="614" y="304">2</text>
  </g>

  <!-- Wall number badges -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="115" cy="316" r="11" fill="#2563eb"/><text x="115" y="320" fill="#fff">1</text>
    <circle cx="60"  cy="188" r="11" fill="#2563eb"/><text x="60"  y="192" fill="#fff">2</text>
    <circle cx="344" cy="60"  r="11" fill="#2563eb"/><text x="344" y="64"  fill="#fff">3</text>
    <circle cx="628" cy="188" r="11" fill="#2563eb"/><text x="628" y="192" fill="#fff">4</text>
    <circle cx="462" cy="316" r="11" fill="#2563eb"/><text x="462" y="320" fill="#fff">5</text>
  </g>

  <text x="350" y="200" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">27½ -2- 64 -2- 142 -2- 63.78 -2- 83   (green = sector count at each corner)</text>
</svg>
