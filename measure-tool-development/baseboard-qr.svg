<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="420" height="360" fill="#ffffff"/>
  <text x="210" y="26" font-size="14" font-weight="bold" text-anchor="middle">B5.5 + QR  (wall-base cross-section)</text>

  <!-- wall -->
  <rect x="60" y="70" width="20" height="230" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="70" y="62" font-size="11" fill="#6b7280" text-anchor="middle">wall</text>

  <!-- floor -->
  <line x1="80" y1="300" x2="360" y2="300" stroke="#6b7280" stroke-width="3"/>
  <text x="330" y="318" font-size="11" fill="#6b7280" text-anchor="middle">floor</text>

  <!-- baseboard: 0.75" thick x 5.5" tall (scale 30px/in) -->
  <rect x="80" y="135" width="22.5" height="165" fill="#d6b38a" stroke="#7c5e34" stroke-width="1.5"/>
  <text x="150" y="150" font-size="12" fill="#7c5e34" text-anchor="start">baseboard 5½" tall</text>
  <text x="150" y="166" font-size="11" fill="#9ca3af" text-anchor="start">(¾" thick)</text>

  <!-- quarter round: 0.75x0.75 at base corner -->
  <path d="M102.5,300 L125,300 A22.5,22.5 0 0,0 102.5,277.5 Z" fill="#b8895a" stroke="#7c5e34" stroke-width="1.5"/>
  <line x1="124" y1="289" x2="180" y2="250" stroke="#7c5e34" stroke-width="1"/>
  <text x="182" y="248" font-size="12" fill="#7c5e34" text-anchor="start">quarter round ¾"×¾"</text>

  <!-- height dimension -->
  <line x1="48" y1="135" x2="48" y2="300" stroke="#374151" stroke-width="1"/>
  <line x1="44" y1="135" x2="52" y2="135" stroke="#374151" stroke-width="1"/>
  <line x1="44" y1="300" x2="52" y2="300" stroke="#374151" stroke-width="1"/>
  <text x="40" y="220" font-size="11" fill="#374151" text-anchor="end">5½"</text>

  <text x="210" y="345" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">applies to every wall in the room; no QR token = no quarter round</text>
</svg>
